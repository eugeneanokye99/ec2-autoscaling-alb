AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Highly available Auto Scaling web tier with ALB, ASG, and Regional NAT Gateway.
  Demonstrates CPU-based scaling and traffic distribution across instances.

# =========================
# NETWORKING
# =========================
Resources:

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: autoscaling-demo-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: autoscaling-demo-igw

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (ALB + NAT)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-public-b

  # Private Subnets (EC2)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-private-b

# =========================
# NAT Gateway (Regional)
# =========================
  NAT:
    Type: AWS::EC2::NatGateway
    DependsOn: IGWAttachment
    Properties:
      ConnectivityType: public
      AvailabilityMode: regional
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Demo-Regional-NAT

  # =========================
  # ROUTING
  # =========================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: autoscaling-demo-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: autoscaling-demo-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: NAT
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NAT

  PrivateSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # =========================
  # SECURITY GROUPS
  # =========================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: ALB SG - allows inbound HTTP from internet
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: autoscaling-demo-alb-sg

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: EC2 SG - allows inbound HTTP from ALB only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: autoscaling-demo-ec2-sg

  # =========================
  # LOAD BALANCER
  # =========================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: autoscaling-demo-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /
      # Faster health check convergence so instances join the target group
      # sooner during demos and scale-out events
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: autoscaling-demo-tg

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # =========================
  # IAM ROLE
  # =========================
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: autoscaling-demo-instance-role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # =========================
  # LAUNCH TEMPLATE
  # =========================
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: autoscaling-demo-lt
      LaunchTemplateData:
        # AL2023 - current recommended Amazon Linux, uses dnf
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
        InstanceType: t3.micro
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        # Enforce IMDSv2 - required for token-based metadata calls below
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        UserData:
          Fn::Base64: |
            #!/bin/bash -xe

            # Update packages
            yum update -y

            # Install Apache
            yum install -y httpd

            # Install EPEL + stress tool
            amazon-linux-extras install epel -y
            yum install -y stress

            # Start Apache
            systemctl enable httpd
            systemctl start httpd

            # -----------------------------
            # IMDSv2 TOKEN
            # -----------------------------
            TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            # Fetch metadata
            AZ=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
            http://169.254.169.254/latest/meta-data/placement/availability-zone)

            INSTANCEID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
            http://169.254.169.254/latest/meta-data/instance-id)

            PRIVATEIP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
            http://169.254.169.254/latest/meta-data/local-ipv4)

            # -----------------------------
            # WEB PAGE
            # -----------------------------
            cat > /var/www/html/index.html << 'HTML'
            <!DOCTYPE html>
            <html>
            <head>
                <title>Auto Scaling Demo</title>
                <meta http-equiv="refresh" content="5">
                <style>
                    * { box-sizing: border-box; margin: 0; padding: 0; }
                    body {
                        font-family: Arial, sans-serif;
                        background: #f4f4f4;
                        min-height: 100vh;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: 20px;
                    }
                    .card {
                        background: white;
                        padding: 36px;
                        border-radius: 12px;
                        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
                        width: 100%;
                        max-width: 480px;
                    }
                    .header {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        margin-bottom: 24px;
                    }
                    h1 { font-size: 20px; color: #232f3e; }
                    .refresh-badge {
                        font-size: 11px;
                        background: #e8f4e8;
                        color: #2d7d2d;
                        padding: 3px 8px;
                        border-radius: 12px;
                    }
                    .info-table {
                        width: 100%;
                        border-collapse: collapse;
                        margin-bottom: 24px;
                    }
                    .info-table td {
                        padding: 12px 0;
                        border-bottom: 1px solid #f0f0f0;
                        font-size: 14px;
                    }
                    .info-table td:first-child { color: #666; width: 40%; }
                    .info-table td:last-child {
                        font-weight: bold;
                        font-family: monospace;
                        color: #232f3e;
                    }
                    .info-table tr:last-child td { border-bottom: none; }
                    .az-badge {
                        background: #fff3e0;
                        color: #e65100;
                        padding: 2px 8px;
                        border-radius: 4px;
                        font-size: 12px;
                        font-weight: bold;
                    }
                    .btn {
                        display: block;
                        width: 100%;
                        background: #ff9900;
                        color: white;
                        padding: 13px 20px;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        font-size: 15px;
                        font-weight: bold;
                        margin-bottom: 16px;
                    }
                    .btn:hover { background: #e68900; }
                    #status {
                        font-size: 13px;
                        color: #2d7d2d;
                        text-align: center;
                        height: 18px;
                        margin-bottom: 12px;
                    }
                    .note {
                        font-size: 12px;
                        color: #999;
                        text-align: center;
                        line-height: 1.5;
                    }
                </style>
            </head>
            <body>
                <div class="card">
                    <div class="header">
                        <h1>🚀 Auto Scaling Demo</h1>
                        <span class="refresh-badge">⟳ 5s</span>
                    </div>
                    <table class="info-table">
                        <tr>
                            <td>Instance ID</td>
                            <td>INSTANCEID_PLACEHOLDER</td>
                        </tr>
                        <tr>
                            <td>Availability Zone</td>
                            <td><span class="az-badge">AZ_PLACEHOLDER</span></td>
                        </tr>
                        <tr>
                            <td>Private IP</td>
                            <td>PRIVATEIP_PLACEHOLDER</td>
                        </tr>
                    </table>
                    <button class="btn" onclick="burnCpu()">🔥 Start CPU Stress</button>
                    <div id="status"></div>
                    <p class="note">Page auto-refreshes every 5 seconds.<br>Reload to observe load balancing across instances.</p>
                </div>
                <script>
                    function burnCpu() {
                        document.getElementById('status').textContent = 'Stress starting...';
                        fetch('/burn')
                            .then(r => r.text())
                            .then(() => { document.getElementById('status').textContent = 'CPU stress running — watch ASG in AWS console!'; })
                            .catch(() => { document.getElementById('status').textContent = 'Error triggering stress'; });
                    }
                </script>
            </body>
            </html>
            HTML

            # Substitute placeholders with real metadata values
            sed -i "s|INSTANCEID_PLACEHOLDER|$INSTANCEID|g" /var/www/html/index.html
            sed -i "s|AZ_PLACEHOLDER|$AZ|g"                 /var/www/html/index.html
            sed -i "s|PRIVATEIP_PLACEHOLDER|$PRIVATEIP|g"   /var/www/html/index.html

            # -----------------------------
            # CPU STRESS CGI SCRIPT
            # -----------------------------
            mkdir -p /var/www/cgi-bin

            cat > /var/www/cgi-bin/burn.sh << 'EOF'
            #!/bin/bash
            echo "Content-Type: text/plain"
            echo ""
            stress --cpu 4 --timeout 60s &
            echo "CPU stress started"
            EOF

            chmod +x /var/www/cgi-bin/burn.sh

            # Enable CGI endpoint
            cat > /etc/httpd/conf.d/burn.conf << 'EOF'
            ScriptAlias /burn /var/www/cgi-bin/burn.sh

            <Directory "/var/www/cgi-bin">
                AllowOverride None
                Options +ExecCGI
                AddHandler cgi-script .sh
                Require all granted
            </Directory>
            EOF

            # Restart Apache
            systemctl restart httpd

            echo "UserData setup complete"

  # =========================
  # AUTO SCALING GROUP
  # =========================
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    Properties:
      MinSize: "1"
      DesiredCapacity: "1"
      MaxSize: "4"
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 60
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        # PropagateAtLaunch: true pushes the Name tag to every EC2 instance the ASG launches
        - Key: Name
          Value: autoscaling-demo-instance
          PropagateAtLaunch: true

  # =========================
  # SCALING POLICY
  # =========================
  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 60
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 30

# =========================
# OUTPUTS
# =========================
Outputs:
  ALBURL:
    Description: Public URL of the Application Load Balancer
    Value: !Sub "http://${ALB.DNSName}"

  ASGName:
    Description: Auto Scaling Group name (use this to manually adjust desired capacity)
    Value: !Ref AutoScalingGroup