AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Highly available Auto Scaling web tier with ALB, ASG, and Regional NAT Gateway.
  Demonstrates CPU-based scaling and traffic distribution across instances.

# =========================
# PARAMETERS
# =========================
Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

# =========================
# NETWORKING
# =========================
Resources:

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: autoscaling-demo-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: autoscaling-demo-igw

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (ALB + NAT)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-public-b

  # Private Subnets (EC2)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: autoscaling-demo-private-b

  # =========================
  # NAT GATEWAY (REGIONAL)
  # =========================
  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatEIP.AllocationId
      Tags:
        - Key: Name
          Value: autoscaling-demo-nat

  # =========================
  # ROUTING
  # =========================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: autoscaling-demo-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: autoscaling-demo-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: NatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # =========================
  # SECURITY GROUPS
  # =========================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: ALB SG - allows inbound HTTP from internet
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: autoscaling-demo-alb-sg

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: EC2 SG - allows inbound HTTP from ALB only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: autoscaling-demo-ec2-sg

  # =========================
  # LOAD BALANCER
  # =========================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: autoscaling-demo-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /
      Tags:
        - Key: Name
          Value: autoscaling-demo-tg

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # =========================
  # IAM ROLE
  # =========================
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: autoscaling-demo-instance-role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # =========================
  # LAUNCH TEMPLATE
  # =========================
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: autoscaling-demo-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        # UserData installs Apache, deploys the demo app, and configures the CGI stress endpoint.
        # The page displays instance-specific metadata (ID, AZ, IP, launch time) and
        # auto-refreshes every 5 seconds to demonstrate round-robin load balancing.
        UserData:
          Fn::Base64: |
            #!/bin/bash
            yum update -y
            yum install -y httpd stress-ng
            systemctl enable httpd
            systemctl start httpd

            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)
            LOCAL_IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
            LAUNCH_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')

            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html>
            <head>
              <title>Auto Scaling Demo</title>
              <meta http-equiv="refresh" content="5">
              <style>
                body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; text-align: center; background: #f4f4f4; }
                .card { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
                h1 { color: #232f3e; }
                .badge { display: inline-block; background: #ff9900; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; margin-bottom: 20px; }
                table { width: 100%; border-collapse: collapse; margin: 20px 0; text-align: left; }
                td { padding: 10px 14px; border-bottom: 1px solid #eee; }
                td:first-child { color: #666; font-size: 13px; width: 40%; }
                td:last-child { font-weight: bold; font-family: monospace; font-size: 14px; }
                .stress-btn { background: #d9534f; color: white; border: none; padding: 12px 28px; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 10px; }
                .stress-btn:hover { background: #c9302c; }
                .note { font-size: 12px; color: #999; margin-top: 16px; }
                #status { margin-top: 12px; font-size: 13px; color: #28a745; height: 20px; }
              </style>
            </head>
            <body>
              <div class="card">
                <div class="badge">Auto Scaling Demo</div>
                <h1>&#9881; Instance Info</h1>
                <table>
                  <tr><td>Instance ID</td><td>$INSTANCE_ID</td></tr>
                  <tr><td>Availability Zone</td><td>$AZ</td></tr>
                  <tr><td>Private IP</td><td>$LOCAL_IP</td></tr>
                  <tr><td>Instance launched</td><td>$LAUNCH_TIME</td></tr>
                </table>
                <button class="stress-btn" onclick="stressCpu()">&#128165; Stress CPU (5 min)</button>
                <div id="status"></div>
                <p class="note">Page auto-refreshes every 5 seconds. Each refresh may hit a different instance.<br>Reload repeatedly to observe load balancing across instances.</p>
              </div>
              <script>
                function stressCpu() {
                  document.getElementById('status').textContent = 'Starting CPU stress...';
                  fetch('/cgi-bin/stress.sh')
                    .then(r => r.text())
                    .then(t => { document.getElementById('status').textContent = 'Stress running on $INSTANCE_ID - watch ASG in AWS console!'; })
                    .catch(() => { document.getElementById('status').textContent = 'Error triggering stress'; });
                }
              </script>
            </body>
            </html>
            EOF

            cat > /var/www/cgi-bin/stress.sh <<'EOF'
            #!/bin/bash
            echo "Content-Type: text/plain"
            echo ""
            nohup stress-ng --cpu 8 --timeout 300s &>/dev/null &
            echo "Stress running on $(curl -s http://169.254.169.254/latest/meta-data/instance-id)"
            EOF

            chmod +x /var/www/cgi-bin/stress.sh

            cat > /etc/httpd/conf.d/cgi.conf <<EOF
            ScriptAlias /cgi-bin/ "/var/www/cgi-bin/"
            <Directory "/var/www/cgi-bin">
              AllowOverride None
              Options +ExecCGI
              AddHandler cgi-script .sh
              Require all granted
            </Directory>
            EOF

            systemctl restart httpd

  # =========================
  # AUTO SCALING GROUP
  # =========================
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    Properties:
      MinSize: "1"
      DesiredCapacity: "2"
      MaxSize: "4"
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 60
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        # PropagateAtLaunch: true pushes the Name tag to every EC2 instance the ASG launches
        - Key: Name
          Value: autoscaling-demo-instance
          PropagateAtLaunch: true

  # =========================
  # SCALING POLICY
  # Target tracking automatically handles both scale-out (CPU > 30%) and
  # scale-in (CPU drops below threshold) without a separate scale-in policy.
  # EstimatedInstanceWarmup gives new instances 60s to stabilise before
  # their metrics influence the scaling decision.
  # =========================
  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 60
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 30

# =========================
# OUTPUTS
# =========================
Outputs:
  ALBURL:
    Description: Public URL of the Application Load Balancer
    Value: !Sub "http://${ALB.DNSName}"

  ASGName:
    Description: Auto Scaling Group name (use this to manually adjust desired capacity)
    Value: !Ref AutoScalingGroup